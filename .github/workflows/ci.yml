name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.128

jobs:
  test:
    name: Library, language server, black-box suite, web build and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------------- rust
      - name: Test the workspace
        run: cargo test --workspace

      # One release build of the whole workspace: it produces the
      # target/release/dpm-nbe binary that the black-box suite below drives,
      # and it still compiles the language server that this job used to build
      # with a separate `cargo build --release -p dpm-nbe-lsp` invocation.
      - name: Build the release binaries (CLI and language server)
        run: cargo build --release

      # ------------------------------------------------------------ blackbox
      # The runner is self-contained: it locates the binary itself (with a
      # .exe fallback that simply does not match on Linux), needs no
      # arguments for the full suite, and exits nonzero on any failing case,
      # which fails this step -- and the job -- as-is.
      - name: Black-box CLI suite
        run: bash blackbox/run.sh

      # Randomized no-panic fuzzer over the same release binary: deterministic
      # default seed, ~20 s.  Any exit status outside {0,1,2}, an internal
      # panic, or a hang fails the script (and this step).
      - name: Randomized fuzz (no-panic invariant)
        run: node blackbox/fuzz.mjs

      # ------------------------------------------------------------ wasm/web
      - uses: actions/cache@v4
        with:
          path: ~/.wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-${{ runner.os }}
      - name: Install wasm-bindgen
        run: |
          if [ ! -x "$HOME/.wasm-bindgen-cli/bin/wasm-bindgen" ]; then
            cargo install --root "$HOME/.wasm-bindgen-cli" \
              wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
          echo "$HOME/.wasm-bindgen-cli/bin" >> "$GITHUB_PATH"

      - name: Build the browser language server
        run: node web/build.mjs

      - name: Web integration tests
        run: |
          node web/tools/smoke.mjs
          node web/tools/client-smoke.mjs

      # ------------------------------------------------------------ extension
      - name: Install the extension client dependencies
        run: npm ci --prefix vscode/client --no-audit --no-fund

      - name: Bundle the extension
        run: npm run bundle --prefix vscode/client

      - name: Extension tests (wasm worker bridge, jsonrpc interoperability)
        run: |
          node vscode/client/test/transport.test.mjs
          node vscode/client/test/jsonrpc.test.mjs
