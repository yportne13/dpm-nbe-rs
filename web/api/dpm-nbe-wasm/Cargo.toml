[package]
name = "dpm-nbe-wasm"
version = "0.1.0"
edition = "2021"
description = "The dpm-nbe language server, compiled to WebAssembly for the browser"
license = "BSD-3-Clause"
publish = false

# This package is deliberately *not* a workspace member of the repository root:
# it is a leaf package built for `wasm32-unknown-unknown` with its own target
# directory and its own Cargo.lock, so that a browser build never disturbs the
# native one.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "dpm_nbe_wasm"
path = "src/lib.rs"

[dependencies]
# The very same protocol/analysis crate the native server uses.
dpm-nbe-lsp = { path = "../../../lsp" }
serde_json = "1.0"
# Must match the `wasm-bindgen` CLI version exactly.
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true

# Panics cannot be caught on `wasm32-unknown-unknown` (unwinding needs the
# exception-handling proposal), so a panic is an instance trap.  Everything the
# module can reach is bounded instead: the parser has its own depth budget, the
# analysis layer refuses files above `MAX_CHECK_BYTES`, and the shadow stack is
# sized at link time in `build.rs`.
