[package]
name = "dpm-nbe"
version = "0.1.0"
edition = "2021"
description = "Dependent pattern matching under normalization by evaluation (Rust port)"
license = "BSD-3-Clause"
publish = false

[lib]
name = "dpm_nbe"
path = "src/lib.rs"

[[bin]]
name = "dpm-nbe"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]

# The language server lives in its own crate so that the `dpm-nbe` library and
# CLI keep their "standard library only" dependency-free identity.
#
# `web/api/dpm-nbe-wasm` is deliberately *not* a member: it is a leaf package
# built for `wasm32-unknown-unknown` with its own target directory.
[workspace]
members = [".", "lsp"]
exclude = ["web/api/dpm-nbe-wasm"]
